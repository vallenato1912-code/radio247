name: RADIO 24-7 PRO
on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
jobs:
  radio:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: |
          ffmpeg -re -stream_loop -1 -i https://mg1.radio.princast.com/8342/stream -f lavfi -i color=c=0x101020:s=1280x720:r=30 -filter_complex "[0:a]asplit=2[a1][a2];[a1]showcqt=s=1280x300:fps=30:count=1:bar_g=8:sono_g=4:tc=0.4,format=rgba[aeq];[1][aeq]overlay=(W-w)/2:120,drawbox=x=0:y=0:w=1280:h=80:color=black@0.8:t=fill,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='RADIO 24/7 VALLENATO':fontcolor=#FF2E63:fontsize=40:x=20:y=15,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='● EN VIVO':fontcolor=red:fontsize=26:x=1050:y=22[outv]" -map "[outv]" -map "[a2]" -c:v libx264 -preset veryfast -b:v 3000k -c:a aac -b:a 128k -f flv ${{ rtmp://a.rtmp.youtube.com/live2/qp7m-rdt6-eyka-0hv2-fd7e
 }}
